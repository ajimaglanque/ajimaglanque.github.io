    <script>
      window.onload = function () {
        document.body.classList.remove("is-preload");
      };
      (function () {
        var dp = document.querySelector(".dp");
        var header = document.getElementById("header");
        function toggleBadges() {
          var showingIcons = header.classList.toggle("show-icons");
          dp.setAttribute("aria-pressed", showingIcons ? "true" : "false");
        }
        dp.addEventListener("click", toggleBadges);
        dp.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleBadges();
          }
        });
      })();
      window.ontouchmove = function () {
        return false;
      };
      window.onorientationchange = function () {
        document.body.scrollTop = 0;
      };
